name: phase2-research

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "forward, slinky-audit, or both"
        required: true
        default: "both"
        type: choice
        options: [both, forward, slinky-audit]
      download_slinky_core:
        description: "Download Slinky token/outcome/migration core tables for schema audit"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run integrity tests
        run: pytest -q
      - name: Run real-data Phase 2 bridge
        env:
          HF_HUB_DISABLE_XET: "0"
          MODE: ${{ github.event.inputs.mode || 'both' }}
          DOWNLOAD_SLINKY_CORE: ${{ github.event.inputs.download_slinky_core || 'true' }}
        run: |
          EXTRA=""
          if [ "$DOWNLOAD_SLINKY_CORE" = "true" ]; then EXTRA="--download-slinky-core"; fi
          python scripts/github_phase2_runner.py --mode "$MODE" --out reports/github_phase2 $EXTRA
      - name: Upload compact research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-research-results
          path: |
            reports/github_phase2/**
          if-no-files-found: warn
          retention-days: 14
