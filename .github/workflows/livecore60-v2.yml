name: livecore60-v2-challenger

on:
  push:
    branches: [main]
    paths:
      - 'src/live/feature60_v2.py'
      - 'scripts/github_livecore60_v2_models.py'
      - '.github/workflows/livecore60-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONPATH: .
      HF_HUB_DISABLE_XET: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Integrity tests
        run: pytest -q
      - name: Stress and freeze v2 challenger
        run: python scripts/github_livecore60_v2_models.py --out reports/livecore60_v2
      - name: Upload challenger evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livecore60-v2-challenger
          path: |
            reports/livecore60_v2/V2_MANIFEST.json
            reports/livecore60_v2/V2_GATE.json
            reports/livecore60_v2/folds.csv
            reports/livecore60_v2/models/*.joblib
          if-no-files-found: warn
          retention-days: 90
