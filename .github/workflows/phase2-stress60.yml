name: phase2-stress60

on:
  push:
    branches: [main]
    paths:
      - 'scripts/github_phase2_stress60.py'
      - 'scripts/github_phase2_stress60_lowmem.py'
      - '.github/workflows/phase2-stress60.yml'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress60:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONPATH: .
      HF_HUB_DISABLE_XET: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Integrity tests
        run: pytest -q
      - name: Run 60-second stress suite
        run: python scripts/github_phase2_stress60_lowmem.py --out reports/stress60
      - name: Upload stress results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-stress60-results
          path: |
            reports/stress60/STRESS_RESULT.json
            reports/stress60/stress_headlines.csv
            reports/stress60/fold_summary.csv
          if-no-files-found: warn
          retention-days: 14
