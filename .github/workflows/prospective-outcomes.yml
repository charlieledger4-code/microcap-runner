name: prospective-executable-outcomes

on:
  schedule:
    - cron: '5 1-23/2 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Alternates with the high-throughput scan hours and shares its ledger lock.
concurrency:
  group: prospective-live60-ledger
  cancel-in-progress: false

jobs:
  outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .
      SOLANA_RPC_URL: https://api.mainnet-beta.solana.com
      SOLANA_RPC_CONCURRENCY: '8'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install outcome runtime
        run: pip install 'aiohttp>=3.9,<4' pytest
      - name: Outcome integrity tests
        run: |
          python -m py_compile scripts/track_pending_outcomes.py scripts/track_pending_outcomes_all.py scripts/build_prospective_scoreboard.py scripts/build_forward_progress.py
          pytest -q tests/test_pump_curve_quote.py tests/test_pumpswap_event.py tests/test_pumpswap_quote.py tests/test_executable_outcomes.py
      - name: Mount append-only prospective ledger
        run: |
          git fetch origin prospective-ledger
          rm -rf /tmp/prospective-ledger-wt
          git worktree add /tmp/prospective-ledger-wt origin/prospective-ledger
      - name: Track primary 24h executable outcomes first
        run: python scripts/track_pending_outcomes_all.py --ledger-root /tmp/prospective-ledger-wt --horizon-s 86400 --max-rows 6 --max-pages 16 --max-txs 5000
      - name: Track 6h executable outcomes
        run: python scripts/track_pending_outcomes_all.py --ledger-root /tmp/prospective-ledger-wt --horizon-s 21600 --max-rows 12 --max-pages 12 --max-txs 3500
      - name: Track 1h executable outcomes
        run: python scripts/track_pending_outcomes_all.py --ledger-root /tmp/prospective-ledger-wt --horizon-s 3600 --max-rows 18 --max-pages 8 --max-txs 2500
      - name: Build immutable prospective scoreboard snapshot
        run: |
          mkdir -p /tmp/prospective-ledger-wt/prospective/scoreboards /tmp/prospective-ledger-wt/prospective/progress
          python scripts/build_prospective_scoreboard.py \
            --ledger-root /tmp/prospective-ledger-wt \
            --out "/tmp/prospective-ledger-wt/prospective/scoreboards/${GITHUB_RUN_ID}.json"
          python scripts/build_forward_progress.py \
            --ledger-root /tmp/prospective-ledger-wt \
            --config configs/forward_experiment_v1.json \
            --out "/tmp/prospective-ledger-wt/prospective/progress/${GITHUB_RUN_ID}.json"
      - name: Commit outcome, scoreboard and progress evidence
        run: |
          git -C /tmp/prospective-ledger-wt config user.name 'microcap-research-bot'
          git -C /tmp/prospective-ledger-wt config user.email 'actions@users.noreply.github.com'
          git -C /tmp/prospective-ledger-wt add prospective/outcomes prospective/scoreboards prospective/progress || true
          if git -C /tmp/prospective-ledger-wt diff --cached --quiet; then
            echo 'No matured new outcomes or scoreboard changes.'
          else
            git -C /tmp/prospective-ledger-wt commit -m "Append prospective outcomes/scoreboard ${GITHUB_RUN_ID}"
            git -C /tmp/prospective-ledger-wt push origin HEAD:prospective-ledger
          fi
