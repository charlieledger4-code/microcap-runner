name: live60-onchain-probe

on:
  push:
    branches: [main]
    paths:
      - 'scripts/live60_onchain_probe_v2.py'
      - 'src/ingest/pump_trade_event.py'
      - 'src/live/feature60.py'
      - '.github/workflows/live60-onchain-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      SOLANA_RPC_URL: https://api.mainnet-beta.solana.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install probe dependencies
        run: pip install 'aiohttp>=3.9' 'websockets>=12' pytest
      - name: Decoder and feature tests
        run: pytest -q tests/test_pump_trade_event.py tests/test_live_feature60.py
      - name: Run completeness-gated prospective on-chain probe
        run: python scripts/live60_onchain_probe_v2.py --out reports/live60_onchain_v2 --collect-s 20 --max-mints 2 --age-s 60 --grace-s 10 --tx-limit 300 --sweeps 3 --sweep-gap-s 3 --rpc-interval .28 --min-fetch-fraction .98
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live60-onchain-probe-v2
          path: |
            reports/live60_onchain_v2/SUMMARY.json
            reports/live60_onchain_v2/launches.jsonl
            reports/live60_onchain_v2/feature_rows.jsonl
            reports/live60_onchain_v2/sweep_audit.jsonl
          if-no-files-found: warn
          retention-days: 14
